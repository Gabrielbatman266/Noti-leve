name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk NotiLeve.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NotiLeve
          path: NotiLeve.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Noti Leve v1.0.${{ github.run_number }}
          body: APK pronto. Baixe o NotiLeve.apk abaixo e instale por cima da versão anterior.
          files: NotiLeve.apk
